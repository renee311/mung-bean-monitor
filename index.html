<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanCounter - Mung Bean Growth Monitor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--accent-green);
        }

        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-online { background-color: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-offline { background-color: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .badge-checking { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-amber); border: 1px solid var(--accent-amber); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }

        .card-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card-value {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .actuator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .actuator-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .state-indicator {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .state-on { background-color: var(--accent-green); color: #000; }
        .state-off { background-color: #334155; color: var(--text-muted); }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>BeanCounter Dashboard</h1>
            <span style="font-size: 0.85rem; color: var(--text-muted);">IoT Telemetry & Control</span>
        </div>
        <div id="status-badge" class="badge badge-checking">CONNECTING...</div>
    </header>

    <!-- Sensor Data Cards -->
    <div class="grid">
        <div class="card">
            <div class="card-title">Soil Moisture</div>
            <div id="val-moisture" class="card-value" style="color: var(--accent-blue);">-- %</div>
        </div>
        <div class="card">
            <div class="card-title">Enclosure Temperature</div>
            <div id="val-temp" class="card-value" style="color: var(--accent-amber);">-- °C</div>
        </div>
        <div class="card">
            <div class="card-title">Relative Humidity</div>
            <div id="val-humidity" class="card-value" style="color: var(--accent-green);">-- %</div>
        </div>
    </div>

    <!-- Actuator Status Section -->
    <h3 style="color: var(--text-muted); margin-bottom: 15px;">ACTUATOR STATES</h3>
    <div class="actuator-grid">
        <div class="actuator-card">
            <span>Water Pump</span>
            <span id="state-pump" class="state-indicator state-off">OFF</span>
        </div>
        <div class="actuator-card">
            <span>Cooling Fan</span>
            <span id="state-fan" class="state-indicator state-off">OFF</span>
        </div>
        <div class="actuator-card">
            <span>Heating Lamp</span>
            <span id="state-light" class="state-indicator state-off">OFF</span>
        </div>
    </div>

    <footer>
        <p id="last-updated">Awaiting initial telemetry broadcast...</p>
    </footer>
</div>

<script>
    async function fetchTelemetry() {
        try {
            const response = await fetch('/api/data');
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            const data = await response.json();

            // Update Connection Status Badge
            const badge = document.getElementById('status-badge');
            if (data.online) {
                badge.textContent = 'ONLINE';
                badge.className = 'badge badge-online';
            } else {
                badge.textContent = data.status === 'no_data' ? 'NO DATA' : 'OFFLINE';
                badge.className = 'badge badge-offline';
            }

            // Update Telemetry Values
            document.getElementById('val-moisture').textContent = 
                (data.moisture !== null && data.moisture !== undefined) ? `${data.moisture}%` : 'N/A';
            
            document.getElementById('val-temp').textContent = 
                (data.temp !== null && data.temp !== undefined) ? `${data.temp.toFixed(1)}°C` : 'N/A';
            
            document.getElementById('val-humidity').textContent = 
                (data.humidity !== null && data.humidity !== undefined) ? `${data.humidity.toFixed(1)}%` : 'N/A';

            // Update Actuator States
            updateActuatorBadge('state-pump', data.pump);
            updateActuatorBadge('state-fan', data.fan);
            updateActuatorBadge('state-light', data.light);

            // Update Timestamp
            document.getElementById('last-updated').textContent = `Last updated: ${data.updated}`;

        } catch (error) {
            console.error('Telemetry Fetch Error:', error);
            const badge = document.getElementById('status-badge');
            badge.textContent = 'DISCONNECTED';
            badge.className = 'badge badge-offline';
        }
    }

    function updateActuatorBadge(elementId, state) {
        const el = document.getElementById(elementId);
        if (state === 1) {
            el.textContent = 'ON';
            el.className = 'state-indicator state-on';
        } else {
            el.textContent = 'OFF';
            el.className = 'state-indicator state-off';
        }
    }

    // Poll endpoint every 3 seconds
    setInterval(fetchTelemetry, 3000);

    // Initial fetch on page load
    fetchTelemetry();
</script>

</body>
</html>
